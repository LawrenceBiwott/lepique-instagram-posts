name: Instagram Auto-Poster

on:
  schedule:
    # Runs every 10 min — script skips if posted within last 55 min
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Instagram poster
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}

          MEDIA_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/media"

        run: python instagram_post.py

      - name: Save updated state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git rm -f media/story_temp.jpg 2>/dev/null || true
          git add state.json post_log.txt

          git diff --cached --quiet || git commit -m "chore: update post state [skip ci]"

          git push
