name: Instagram Auto-Poster

on:
  schedule:
    # Runs every 10 min — script skips if posted within last 55 min
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post now (bypasses the 55-min interval guard)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  post:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Instagram poster
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}

          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FORCE_POST: ${{ github.event.inputs.force_post }}

          MEDIA_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/media"

        run: python instagram_post.py

      - name: Save updated state back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin main
          git rm -f media/story_temp.jpg 2>/dev/null || true
          git add state.json post_log.txt

          git diff --cached --quiet || git commit -m "chore: update post state [skip ci]"

          git push
